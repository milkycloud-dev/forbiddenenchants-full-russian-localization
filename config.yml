# Конфигурация Forbidden Enchants

# Инжектор структур и хранилищ испытаний
structure_injector:
  enabled: false
  default_chance: 5.0
  notify_on_add: false
  rarity_apply_to_items: true
  vaults:
    enabled: false
    normal_chance: 7.5
    ominous_chance: 12.5
    normal_loot_mode: all
    ominous_loot_mode: all
    normal_mystery_state: all
    ominous_mystery_state: all
  structures:
    minecraft:trial_chambers: 12.5
    minecraft:ancient_city: 8.0
  loot_mode:
    minecraft:trial_chambers: item_only
  mystery_state:
    minecraft:trial_chambers: mystery_only
  book_rarity: {}

# Торговля жителей-библиотекарей
librarian_trades:
  enabled: false
  trades:
    - enchant: divine_vision
      level: 1
      chance: 25.0
      emeralds: 16
      books: 1

# Инжектор стола зачарований
enchanting_table_injector:
  enabled: false
  xp_cost: 35
  books: []

# Дроп мешочков с мобов
bundle_drop:
  enabled: false
  chance: 5.0 # базовый шанс при быстром включении мобов в GUI
  mob_chance: {}
  rewards: []
  extra_drops: []

# Награды при первом входе на сервер
join_rewards:
  enabled: false
  mode: first_join
  delivery: inventory
  message: true
  message_text: null
  world: null
  items: []
